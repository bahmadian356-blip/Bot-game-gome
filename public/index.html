<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEHI PLAY</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>BEHI PLAY 🚢</h1>
      <div id="user-info">در حال بارگذاری پروفایل...</div>
    </header>

    <main>
      <section id="menu-screen" class="screen active">
        <h2>انتخاب بازی</h2>
        <div class="game-card" onclick="startBattleshipGame()">
          <h3>🚢 کشتی مخفی (Battleship)</h3>
          <p>بازی کلاسیک نبرد ناوها به صورت آنلاین یا با هوش مصنوعی</p>
        </div>
      </section>

      <section id="lobby-screen" class="screen">
        <h2>اتاق بازی</h2>
        <div id="room-code-display">کد اتاق: <span id="code-text">---</span></div>
        <div id="players-list">بازیکنان:</div>
        <button id="start-vs-bot-btn" onclick="startVsBot()">شروع بازی با هوش مصنوعی</button>
      </section>

      <section id="game-screen" class="screen">
        <h2>میدان نبرد</h2>
        <div id="battleship-board-container"></div>
        <div id="game-status-text">نوبت شماست!</div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
